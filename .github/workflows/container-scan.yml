name: container-scan
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # ogni lunedì alle 06:00 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secure-cloud:ci . 

      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan (fail on fixable high+)
        run: grype docker:secure-cloud:ci --only-fixed --fail-on high